name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: qbsfotperzzhuimnpmto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a03446-tutorial-website

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the four payment functions
        run: |
          supabase functions deploy payment-request --project-ref "$PROJECT_REF"
          supabase functions deploy payment-verify --project-ref "$PROJECT_REF"
          supabase functions deploy check-course-access --project-ref "$PROJECT_REF"
          supabase functions deploy get-my-courses --project-ref "$PROJECT_REF"

      - name: Verify deployment
        run: supabase functions list --project-ref "$PROJECT_REF"
