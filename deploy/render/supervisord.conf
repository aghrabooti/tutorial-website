[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:postgrest]
command=/usr/local/bin/postgrest
user=nextjs
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:next]
command=/usr/local/bin/node /app/server.js
directory=/app
user=nextjs
environment=PORT="3000", HOSTNAME="127.0.0.1", PGRST_DB_URI=""
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
environment=PGRST_DB_URI=""
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
