services:
  next-app:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/next.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      PRICE_TO_RIAL_FACTOR: ${PRICE_TO_RIAL_FACTOR:-10}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile
    restart: unless-stopped
    depends_on:
      next-app:
        condition: service_healthy
    ports:
      # فقط reverse proxy روی همان سرور به این پورت وصل شود.
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
