services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutorial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_API_PASSWORD: ${DATABASE_API_PASSWORD:?Set DATABASE_API_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tutorial"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-api:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://tutorial_api_login:${DATABASE_API_PASSWORD}@db:5432/tutorial
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: tutorial_api
    networks: [data]

  next-app:
    image: tutorial-next:local
    build:
      context: ../..
      dockerfile: deploy/self-hosted/next.Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    depends_on:
      db-api:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_API_URL: http://db-api:3000
      FILE_STORAGE_DIR: /app/var/files
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?Set FILE_SIGNING_SECRET in .env}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      PRICE_TO_RIAL_FACTOR: ${PRICE_TO_RIAL_FACTOR:-10}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      SMS_IR_TEMPLATE_ID: ${SMS_IR_TEMPLATE_ID:-}
      SMS_IR_LINE_NUMBER: ${SMS_IR_LINE_NUMBER:-}
      SMS_IR_OTP_PARAMETER: ${SMS_IR_OTP_PARAMETER:-CODE}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-60}
    volumes:
      - files:/app/var/files
    networks: [default, data]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 9

  web:
    image: tutorial-web:local
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile
    restart: unless-stopped
    depends_on:
      next-app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  data:
    internal: true

volumes:
  database:
  files:
