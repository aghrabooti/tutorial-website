server {
    listen 80 default_server;
    server_name mahdiazizi.com www.mahdiazizi.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # APIهای جدید هم‌مبدأ به سرویس Next.js می‌روند؛ مسیرهای قدیمی هنوز مستقیم
    # از مرورگر به Supabase می‌روند تا هر endpoint جداگانه منتقل شود.
    location ^~ /api/ {
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Vercel cleanUrls: /courses -> /courses.html، بدون حذف مسیرهای .html
    # صریحی که صفحه‌ها (مثلاً components/header.html) درخواست می‌کنند.
    location = / {
        try_files /index.html =404;
    }

    # Vercel trailingSlash=false
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # ابتدا فایل دقیق، سپس نسخه‌ی .html برای URLهای clean.
    location / {
        try_files $uri $uri.html =404;
    }
}

server {
    listen 80;
    server_name admin.mahdiazizi.com www.admin.mahdiazizi.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # معادل هدایت ریشه‌ی زیردامنه‌ی مدیر در vercel.json
    location = / {
        return 302 /admin-login;
    }

    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
