server {
    listen 80 default_server;
    server_name mahdiazizi.com www.mahdiazizi.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # همه‌ی APIهای فعال هم‌مبدأ از اینجا به Next.js می‌روند؛ داده در PostgreSQL
    # است و فایل‌ها از volume محلی سرو می‌شوند. هیچ درخواست API به Supabase proxy نمی‌شود.
    # Upload targets are time-limited signed requests. Stream them to Next
    # rather than buffering large PDFs in Nginx; private links are omitted from logs.
    location = /api/storage/upload {
        client_max_body_size 105m;
        client_body_timeout 180s;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/storage/download {
        access_log off;
        proxy_read_timeout 180s;
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /api/ {
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Vercel cleanUrls: /courses -> /courses.html، بدون حذف مسیرهای .html
    # صریحی که صفحه‌ها (مثلاً components/header.html) درخواست می‌کنند.
    location = / {
        try_files /index.html =404;
    }

    # Vercel trailingSlash=false
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # ابتدا فایل دقیق، سپس نسخه‌ی .html برای URLهای clean.
    # Public course/site images live in the persistent local volume. Private
    # course PDFs are intentionally not exposed by Nginx.
    location ^~ /storage/course-images/ {
        alias /srv/tutorial-storage/course-images/;
        autoindex off;
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /storage/ {
        return 404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}

server {
    listen 80;
    server_name admin.mahdiazizi.com www.admin.mahdiazizi.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
