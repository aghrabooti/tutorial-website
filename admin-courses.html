<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت دوره‌ها | پنل ادمین</title>
    
<link
href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
rel="stylesheet">

<style>

body{
    font-family: Vazir,sans-serif;
}

#edit-modal{
    backdrop-filter: blur(4px);
}

</style>

</head>

<body id="admin-courses" class="bg-gray-100 min-h-screen">

<div id="header"></div>



<header class="bg-white border-b shadow-sm">

<div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">

<div>

<h1 class="text-2xl font-black text-gray-800">
مدیریت دوره‌ها
</h1>

<p class="text-sm text-gray-500 mt-1">
پنل مدیریت آکادمی
</p>

</div>

<div class="flex gap-3">

<button
onclick="createCourse()"
class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-bold">

+
ایجاد محتوای جدید

</button>

<button
onclick="logout()"
class="bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-xl font-bold">

خروج

</button>

</div>

</div>

</header>





<main class="max-w-7xl mx-auto px-6 py-10">

<div
id="message"
class="mb-5 text-sm text-gray-500">
</div>

<h2 class="text-xl font-black mb-5">

لیست دوره‌ها

</h2>

<div
id="courses-list"
class="space-y-5">

<div class="bg-white rounded-2xl p-8 text-center text-gray-400">

در حال دریافت دوره‌ها...

</div>

</div>

</main>







<!-- Edit Modal -->

<div
id="edit-modal"
class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">

<div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl p-8">

<div class="flex justify-between items-center mb-8">

<h2 class="text-2xl font-black">

ویرایش دوره

</h2>

<button
onclick="closeEditModal()"
class="text-3xl text-gray-400 hover:text-red-500">

×

</button>

</div>



<input
type="hidden"
id="edit-course-id">



<div class="grid grid-cols-2 gap-5">

<div>

<label class="font-bold text-sm">

عنوان

</label>

<input
id="edit-title"
class="mt-2 w-full border rounded-xl p-3">

</div>



<div>

<label class="font-bold text-sm">

قیمت

</label>

<input
id="edit-price"
type="number"
class="mt-2 w-full border rounded-xl p-3">

</div>



<div>

<label class="font-bold text-sm">

قیمت با تخفیف

</label>

<input
id="edit-discount"
type="number"
class="mt-2 w-full border rounded-xl p-3">

</div>



<div>

    <label class="font-bold text-sm">
    پایه
    </label>

    <select
    id="edit-grade"
    class="mt-2 w-full border rounded-xl p-3">

        <option value="">
            انتخاب پایه
        </option>

        <option value="9">
            9
        </option>

        <option value="10">
            10
        </option>

        <option value="11">
            11
        </option>

        <option value="12">
            12
        </option>

    </select>

</div>
<div>

<label class="font-bold text-sm">
رشته
</label>

<select
id="edit-major"
disabled
class="mt-2 w-full border rounded-xl p-3 bg-gray-100">

<option value="">
بدون رشته
</option>

<option value="ریاضی">
ریاضی
</option>

<option value="تجربی">
تجربی
</option>

<option value="انسانی">
انسانی
</option>

</select>

</div>



<div>

<label class="font-bold text-sm">

دسته بندی

</label>

<input
id="edit-category"
class="mt-2 w-full border rounded-xl p-3">

</div>



<div>

<label class="font-bold text-sm">

نوع

</label>

<select
    id="edit-type"
    class="mt-2 w-full border rounded-xl p-3">

    <option value="course">
    دوره
    </option>

    <option value="lecture">
    جزوه
    </option>

    <option value="book">
    کتاب
    </option>

</select>

</div>



<div>

<label class="font-bold text-sm">

تصویر

</label>

<input
id="edit-image"
class="mt-2 w-full border rounded-xl p-3">

</div>

</div>





<div class="mt-5">

<label class="font-bold text-sm">

توضیحات

</label>

<textarea
id="edit-description"
rows="6"
class="mt-2 w-full border rounded-xl p-3"></textarea>

</div>





<div class="flex justify-end gap-3 mt-8">

<button
onclick="closeEditModal()"
class="bg-gray-200 px-6 py-3 rounded-xl">

انصراف

</button>

<button
onclick="saveCourse()"
class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl">

ذخیره تغییرات

</button>

</div>

</div>

</div>





<script src="/js/api.js"></script>
<script src="/js/auth-state.js"></script>
<script src="/js/header.js"></script>
<script src="/js/cart-badge.js"></script>
<script src="/js/admin-courses.js"></script>

</body>

</html>
